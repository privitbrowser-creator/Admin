name: Build Android Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build admin-app
        run: |
          cd admin-app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build payload-template
        run: |
          cd payload-template
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apks
          path: |
            admin-app/app/build/outputs/apk/debug/*.apk
            payload-template/app/build/outputs/apk/debug/*.apk
